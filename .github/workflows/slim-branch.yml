name: Slim Branch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to create/update (e.g. slim/cpp-only)"
        required: true
        default: "slim/cpp-only"
      source_ref:
        description: "Source branch/ref to slim (e.g. cpp-dev)"
        required: true
        default: "cpp-dev"
      dry_run:
        description: "Do not push; only simulate and log"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  slim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create/update slim branch
        run: |
          scripts/ci/create_slim_branch.sh \
            "${{ inputs.target_branch }}" \
            "${{ inputs.source_ref }}" \
            "${{ inputs.dry_run }}"

name: CI

on:
  push:
    branches: [cpp-dev, main]
    paths:
      - 'cpp/**'
      - 'charts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [cpp-dev, main]
    paths:
      - 'cpp/**'
      - 'charts/**'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake build-essential libsdl2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake sdl2

      # Cache the FetchContent downloads (_deps) keyed on CMakeLists.txt
      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: cpp/build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cpp/CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S cpp -B cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_BGFX=OFF \
            -DUSE_SDL3=OFF

      - name: Build
        run: cmake --build cpp/build --parallel

      - name: Test — engine (autoplay + compile round-trip)
        run: |
          if [ -d charts ]; then
            cpp/build/test_engine --auto-discover charts
          else
            echo "charts/ not found; running unit tests only"
            cpp/build/test_engine
          fi

      - name: Test — parsers
        run: |
          if [ -d charts ]; then
            cpp/build/test_parser charts
          else
            echo "charts/ not found; skipping parser chart-scan tests"
          fi

      - name: Test — easing
        run: cpp/build/test_easing

  lint-scripts:
    name: Lint Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python3 -m py_compile cpp/scripts/new_mod.py

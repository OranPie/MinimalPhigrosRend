plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.phigros.renderer'
    compileSdk 34

    defaultConfig {
        applicationId "org.phigros.renderer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0-dev"

        externalNativeBuild {
            cmake {
                // Build all 4 ABIs for maximum device coverage
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                arguments "-DUSE_BGFX=OFF",
                          "-DUSE_SDL3=OFF",
                          "-DPHIGROS_ANDROID_LIB=ON",
                          "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"   // points to cpp/CMakeLists.txt
            version "3.22.0+"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.01')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

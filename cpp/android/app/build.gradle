plugins {
    id 'com.android.application'
}

android {
    namespace 'org.phigros.renderer'
    compileSdk 34

    defaultConfig {
        applicationId "org.phigros.renderer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0-dev"

        externalNativeBuild {
            cmake {
                // Build all 4 ABIs for maximum device coverage
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                arguments "-DUSE_BGFX=OFF",
                          "-DUSE_SDL3=OFF",
                          "-DBUILD_RENDER_APP=ON",
                          "-DBUILD_LEGACY_CLI=OFF",
                          "-DBUILD_PYTHON_BINDINGS=OFF",
                          "-DUSE_LIBAV=OFF",
                          "-DUSE_ENCRYPTION=OFF",
                          "-DANDROID_STL=c++_shared"
                targets "phigros_sdl_app"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"   // points to cpp/CMakeLists.txt
            version "3.22.0+"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

dependencies {
}

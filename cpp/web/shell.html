<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Phigros Renderer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0e; color: #eee; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
h1 { margin: 16px 0 8px; font-size: 1.2rem; color: #aaa; }
#controls { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; justify-content: center; }
.ctrl-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ctrl-group label { font-size: 0.7rem; color: #888; }
#controls button, #controls input[type=file], #controls select { padding: 6px 12px; border-radius: 4px; border: 1px solid #444; background: #222; color: #ddd; font-size: 0.85rem; cursor: pointer; }
#controls button:hover { background: #333; }
#controls button:disabled { opacity: 0.4; cursor: default; }
#canvas-container { position: relative; width: 100%; max-width: 1280px; aspect-ratio: 16/9; }
canvas { width: 100%; height: 100%; display: block; background: #000; border-radius: 4px; touch-action: none; }
#status { margin-top: 8px; font-size: 0.8rem; color: #888; min-height: 1.2em; }
#drop-zone { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,100,255,0.3); display: none; align-items: center; justify-content: center; font-size: 2rem; color: #fff; z-index: 100; pointer-events: none; }
</style>
</head>
<body>
<h1>Phigros Chart Renderer</h1>
<div id="controls">
  <div class="ctrl-group">
    <label>Chart (.json/.zip)</label>
    <input type="file" id="chart-file" accept=".json,.zip">
  </div>
  <div class="ctrl-group">
    <label>Respack (.zip)</label>
    <input type="file" id="respack-file" accept=".zip">
  </div>
  <div class="ctrl-group">
    <label>Audio (.ogg/.mp3/.wav)</label>
    <input type="file" id="audio-file" accept=".ogg,.mp3,.wav,.flac">
  </div>
  <button id="btn-play" disabled>▶ Play</button>
  <button id="btn-fullscreen">⛶ Fullscreen</button>
</div>
<div id="canvas-container">
  <canvas id="canvas" tabindex="1"></canvas>
</div>
<div id="status">Loading engine…</div>
<div id="drop-zone">Drop chart / respack / audio file here</div>

<script>
var loadedFiles = { chart: null, respack: null, audio: null };

var Module = {
  canvas: document.getElementById('canvas'),
  print: function(t) { console.log(t); },
  printErr: function(t) { console.error(t); },
  noInitialRun: true,
  onRuntimeInitialized: function() {
    try { FS.mkdir('/data'); } catch(e) {}
    document.getElementById('status').textContent = 'Engine ready — load a chart to begin';
    updatePlayBtn();
  },
  arguments: []
};

function setStatus(msg) { document.getElementById('status').textContent = msg; }

function writeToFS(path, data) {
  var dir = path.substring(0, path.lastIndexOf('/'));
  if (dir) { try { FS.mkdirTree(dir); } catch(e) {} }
  FS.writeFile(path, data);
}

function detectFileType(file) {
  var ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'json') return 'chart';
  if (ext === 'zip') {
    if (file.name.match(/respack|resource|skin/i)) return 'respack';
    return 'chart'; // assume chart zip by default
  }
  if (['ogg','mp3','wav','flac'].indexOf(ext) >= 0) return 'audio';
  return 'chart';
}

function handleFile(file, forceType) {
  var type = forceType || detectFileType(file);
  var reader = new FileReader();
  reader.onload = function(e) {
    var data = new Uint8Array(e.target.result);
    var path = '/data/' + file.name;
    writeToFS(path, data);
    loadedFiles[type] = path;
    setStatus('Loaded ' + type + ': ' + file.name);
    updatePlayBtn();
  };
  reader.readAsArrayBuffer(file);
}

function updatePlayBtn() {
  var btn = document.getElementById('btn-play');
  btn.disabled = !loadedFiles.chart || !Module.calledRun && !Module.onRuntimeInitialized;
  if (loadedFiles.chart) btn.disabled = false;
}

function startRender() {
  if (!loadedFiles.chart) return;
  var args = [loadedFiles.chart];
  if (loadedFiles.respack) { args.push('--respack'); args.push(loadedFiles.respack); }
  if (loadedFiles.audio)   { args.push('--audio');   args.push(loadedFiles.audio); }
  setStatus('Rendering…');
  try { Module.callMain(args); }
  catch(e) { setStatus('Error: ' + e.message); }
}

// File inputs
document.getElementById('chart-file').addEventListener('change', function(e) {
  if (e.target.files[0]) handleFile(e.target.files[0], 'chart');
});
document.getElementById('respack-file').addEventListener('change', function(e) {
  if (e.target.files[0]) handleFile(e.target.files[0], 'respack');
});
document.getElementById('audio-file').addEventListener('change', function(e) {
  if (e.target.files[0]) handleFile(e.target.files[0], 'audio');
});
document.getElementById('btn-play').addEventListener('click', startRender);

// Drag & drop
document.addEventListener('dragover', function(e) { e.preventDefault(); document.getElementById('drop-zone').style.display = 'flex'; });
document.addEventListener('dragleave', function(e) { if (!e.relatedTarget) document.getElementById('drop-zone').style.display = 'none'; });
document.addEventListener('drop', function(e) {
  e.preventDefault();
  document.getElementById('drop-zone').style.display = 'none';
  for (var i = 0; i < e.dataTransfer.files.length; i++) {
    handleFile(e.dataTransfer.files[i]);
  }
});

// Fullscreen
document.getElementById('btn-fullscreen').addEventListener('click', function() {
  var c = document.getElementById('canvas');
  if (c.requestFullscreen) c.requestFullscreen();
  else if (c.webkitRequestFullscreen) c.webkitRequestFullscreen();
});

// Responsive canvas
function resizeCanvas() {
  var ct = document.getElementById('canvas-container');
  var w = ct.clientWidth;
  Module.canvas.width = Math.min(w, 1920);
  Module.canvas.height = Math.min(Math.round(w * 9 / 16), 1080);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
</script>
{{{ SCRIPT }}}
</body>
</html>

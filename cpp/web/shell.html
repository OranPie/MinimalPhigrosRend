<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phigros Renderer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0e; color: #eee; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
h1 { margin: 16px 0 8px; font-size: 1.2rem; color: #aaa; }
#controls { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; justify-content: center; }
#controls button, #controls input, #controls select { padding: 6px 12px; border-radius: 4px; border: 1px solid #444; background: #222; color: #ddd; font-size: 0.85rem; cursor: pointer; }
#controls button:hover { background: #333; }
#canvas-container { position: relative; width: 100%; max-width: 1280px; aspect-ratio: 16/9; }
canvas { width: 100%; height: 100%; display: block; background: #000; border-radius: 4px; }
#status { margin-top: 8px; font-size: 0.8rem; color: #888; }
#drop-zone { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,100,255,0.3); display: none; align-items: center; justify-content: center; font-size: 2rem; color: #fff; z-index: 100; pointer-events: none; }
</style>
</head>
<body>
<h1>Phigros Chart Renderer</h1>
<div id="controls">
  <input type="file" id="chart-file" accept=".json,.zip" title="Load chart">
  <input type="file" id="respack-file" accept=".zip" title="Load respack">
  <select id="preset">
    <option value="default">Default Config</option>
  </select>
  <button id="btn-play">▶ Play</button>
  <button id="btn-pause">⏸ Pause</button>
  <button id="btn-fullscreen">⛶ Fullscreen</button>
</div>
<div id="canvas-container">
  <canvas id="canvas" tabindex="1"></canvas>
</div>
<div id="status">Drop a .json chart file to begin</div>
<div id="drop-zone">Drop chart file here</div>

<script>
// Emscripten module configuration
var Module = {
  canvas: document.getElementById('canvas'),
  print: function(text) { console.log(text); },
  printErr: function(text) { console.error(text); },
  onRuntimeInitialized: function() {
    document.getElementById('status').textContent = 'Engine ready';
  },
  arguments: []
};

// Drag and drop
document.addEventListener('dragover', function(e) { e.preventDefault(); document.getElementById('drop-zone').style.display = 'flex'; });
document.addEventListener('dragleave', function(e) { if (!e.relatedTarget) document.getElementById('drop-zone').style.display = 'none'; });
document.addEventListener('drop', function(e) {
  e.preventDefault();
  document.getElementById('drop-zone').style.display = 'none';
  var file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});

// File input
document.getElementById('chart-file').addEventListener('change', function(e) {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

function loadFile(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var data = new Uint8Array(e.target.result);
    var path = '/charts/' + file.name;
    try { FS.mkdir('/charts'); } catch(e) {}
    FS.writeFile(path, data);
    document.getElementById('status').textContent = 'Loaded: ' + file.name;
    // Start rendering
    if (Module._main_load_chart) {
      Module._main_load_chart(path);
    }
  };
  reader.readAsArrayBuffer(file);
}

// Fullscreen
document.getElementById('btn-fullscreen').addEventListener('click', function() {
  var c = document.getElementById('canvas');
  if (c.requestFullscreen) c.requestFullscreen();
});

// Responsive canvas sizing
function resizeCanvas() {
  var container = document.getElementById('canvas-container');
  var w = container.clientWidth;
  var h = Math.round(w * 9 / 16);
  Module.canvas.width = Math.min(w, 1920);
  Module.canvas.height = Math.min(h, 1080);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
</script>
{{{ SCRIPT }}}
</body>
</html>
